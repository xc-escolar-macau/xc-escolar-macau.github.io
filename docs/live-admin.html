<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0c0e12">
<title>終點輸入</title>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="live-admin.css?v=20261127c">
</head>
<body>
<header class="top">
  <b id="title">終點輸入</b>
  <span id="sync" class="sync">未登入</span>
  <button id="logout" class="ghost" hidden>登出</button>
</header>

<!-- 登入 -->
<section id="login" class="panel">
  <h1>工作人員登入</h1>
  <p class="muted">只限獲授權的工作人員。帳戶由網站管理員建立。</p>
  <label>電郵<input id="email" type="email" autocomplete="username" inputmode="email"></label>
  <label>密碼<input id="pw" type="password" autocomplete="current-password"></label>
  <button id="loginBtn" class="primary">登入</button>
  <p id="loginMsg" class="msg" role="alert"></p>
  <hr>
  <a class="practice-link" href="live-admin.html?cp=1">途經點輸入（途經點工作人員用；只供終點排序，不會公開）›</a>
  <a class="practice-link" href="live-admin.html?practice=1">練習模式（不寫入資料庫；已登入者使用今屆真實名單，否則以第 47 屆成績示範）›</a>
</section>

<!-- 主畫面 -->
<main id="app" hidden>
  <section class="bar">
    <select id="event" aria-label="資料">
      <option value="48">正式（第 48 屆）</option>
      <option value="test">演練（不公開）</option>
    </select>
    <select id="grp" aria-label="組別及分組"></select>
    <button id="topBtn" class="ghost top-btn" type="button" hidden>小學頭十名紀念卡</button>
  </section>
  <p id="cpNote" class="cp-note" hidden>途經點模式：只用於終點排序，不計圈、不計名次，不會在即時成績公開。運動員經過時輸入或按號碼布。</p>

  <section id="practiceBar" class="practice" hidden>
    <div class="p-head"><b>練習模式</b><small id="pSrc"></small><label class="p-speed">倍速<select id="pSpeed"><option value="1">1×</option><option value="2">2×</option><option value="4">4×</option></select></label><span id="pScore"></span></div>
    <div id="passing" class="passing" aria-live="polite"></div>
  </section>

  <section class="clock">
    <div><span id="grpLabel" class="grp-label"></span><b id="clock">0:00.0</b><small id="cut"></small></div>
    <div class="clock-btns">
      <button id="startBtn" class="go">開賽計時</button>
      <button id="doneBtn" class="ghost" hidden>本組完成</button>
      <button id="adjBtn" class="ghost" hidden>修正起跑</button>
      <button id="certBtn" class="ghost cert" hidden>核對後開放紀念卡</button>
    </div>
  </section>

  <section class="entry">
    <div class="display">
      <span id="bib" class="bib" aria-live="polite"></span>
      <span id="who" class="who">輸入號碼布</span>
      <button id="micBtn" class="mic" type="button" aria-label="語音輸入（試驗）" aria-pressed="false" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3" fill="currentColor"/><path d="M5.5 11a6.5 6.5 0 0 0 13 0M12 17.5V21" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></button>
    </div>
    <div id="vlog" class="vlog" hidden aria-live="polite"></div>
    <div id="bubbles" class="bubbles" hidden></div>
    <div class="list">
      <div class="list-head"><div id="listTabs" class="list-tabs" role="tablist"></div><button id="lockBtn" class="ghost lock">鎖定排序</button><button id="padBtn" class="ghost lock" type="button" aria-label="收起或顯示數字鍵">⌨ 收起</button></div>
      <p id="slotNote" class="slot-note" hidden></p>
      <ol id="list"></ol>
    </div>
    <div class="pad" id="pad">
      <button data-k="1">1</button><button data-k="2">2</button><button data-k="3">3</button>
      <button data-k="4">4</button><button data-k="5">5</button><button data-k="6">6</button>
      <button data-k="7">7</button><button data-k="8">8</button><button data-k="9">9</button>
      <button data-k="del" class="fn reset" aria-label="重新輸入">重新輸入</button><button data-k="0">0</button><button data-k="ok" class="ok">確認</button>
    </div>
    <div class="extra">
      <button id="markBtn" class="mark">⏱ 先記時間</button>
      <button id="schoolBtn" class="ghost">按學校記錄</button>
      <button id="dnsBtn" class="ghost dns-btn">點名</button>
      <button id="undoBtn" class="undo" disabled>↶ 撤銷</button>
    </div>
  </section>

</main>

<!-- 學校選擇／修改 -->
<dialog id="sheet"><form method="dialog" id="sheetBody"></form></dialog>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="live-core.js?v=20261125d"></script>
<script src="live-admin.js?v=20261127c"></script>
</body>
</html>
