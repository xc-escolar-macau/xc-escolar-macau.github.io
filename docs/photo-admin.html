<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0c0e12">
<title>相片上載</title>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="live-admin.css?v=20261123c">
<link rel="stylesheet" href="photo-admin.css?v=20261126a">
</head>
<body>
<header class="top">
  <b>相片上載</b>
  <span id="sync" class="sync">未登入</span>
  <button id="logout" class="ghost" hidden>登出</button>
</header>

<!-- 登入 -->
<section id="login" class="panel">
  <h1>工作人員登入</h1>
  <p class="muted">只限獲授權的工作人員（與終點輸入同一帳戶）。</p>
  <label>電郵<input id="email" type="email" autocomplete="username" inputmode="email"></label>
  <label>密碼<input id="pw" type="password" autocomplete="current-password"></label>
  <button id="loginBtn" class="primary">登入</button>
  <p id="loginMsg" class="msg" role="alert"></p>
</section>

<!-- 主畫面 -->
<main id="app" hidden>
  <section class="bar">
    <select id="event" aria-label="資料">
      <option value="48">正式（第 48 屆）</option>
      <option value="test">演練（不公開）</option>
    </select>
    <button type="button" id="clockBtn" class="ghost">相機時間：未校正</button>
  </section>

  <label class="pick" id="pick">
    <span class="pick-plus" aria-hidden="true">＋</span>
    <span><b>揀相片上載</b><small>可一次揀多張；上載前在手機內壓縮，並去除位置等相片資料。大批相機相片請先在電腦用 photo_prep 壓縮及掃描號碼布，再揀「_上載」資料夾內的相片</small></span>
    <input id="files" type="file" accept="image/*" multiple>
  </label>
  <p id="prep" class="prep" aria-live="polite" hidden></p>

  <section class="stats" aria-live="polite">
    <div><b id="nQueue">0</b><span>本機待上載</span></div>
    <div><b id="nPending">0</b><span>待覆核</span></div>
    <div><b id="nApproved">0</b><span>已公開</span></div>
  </section>
  <p id="queueMsg" class="queue-msg" hidden></p>

  <div class="tabs" role="tablist">
    <button role="tab" data-tab="pending" class="on">待覆核</button>
    <button role="tab" data-tab="approved">已公開</button>
    <button role="tab" data-tab="queue">本機佇列</button>
  </div>
  <p id="tabNote" class="muted tab-note"></p>
  <div id="grid" class="grid"></div>
</main>

<!-- 覆核一張相片 -->
<dialog id="sheet">
  <form method="dialog" id="sheetBody"></form>
</dialog>

<!-- 相機時間校正 -->
<dialog id="clock">
  <form method="dialog">
    <div class="clock-head"><h2>相機時間校正</h2><button type="submit" class="ghost">關閉</button></div>
    <p class="muted">相片要靠拍攝時間判斷該組是否在跑道上。相機時鐘不準，相片會全部留待覆核。比賽前每部相機做一次即可。</p>
    <ol class="clock-steps">
      <li>用相機影下面這個時鐘（手機時間）</li>
      <li>等相片傳到手機後，在下面揀這張相片</li>
      <li>輸入相中時鐘顯示的時間</li>
    </ol>
    <div id="clockNow" class="clock-now" aria-live="off">--:--:--</div>
    <label class="clock-file">揀剛才影的時鐘相片<input id="clockFile" type="file" accept="image/*"></label>
    <p id="clockInfo" class="muted"></p>
    <label>相中時鐘顯示的時間<input id="clockSeen" inputmode="numeric" autocomplete="off" placeholder="例如 081048 或 8:10:48"></label>
    <button type="button" id="clockApply" class="primary" autofocus>計算並套用</button>
    <p id="clockMsg" class="msg" role="alert"></p>
    <h3 class="clock-sub">已校正的相機</h3>
    <ul id="clockList" class="clock-list"></ul>
  </form>
</dialog>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="photo-admin.js?v=20261127c"></script>
</body>
</html>
